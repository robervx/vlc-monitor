<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Intelligent City Monitor</title>

    <!-- PWA — spec 028. El <link rel="manifest"> lo inyecta vite-plugin-pwa. -->
    <meta name="theme-color" content="#0b1f33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IC Monitor" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Layout escritorio/móvil — spec 029. Se fija antes del primer pintado
         para que no haya parpadeo; deteccion-dispositivo.ts lo mantiene en
         sincronía de forma reactiva. -->
    <script>
      (function () {
        try {
          var f = localStorage.getItem('imc:layout-forzado');
          if (f === 'movil' || f === 'escritorio') {
            document.documentElement.dataset.layout = f;
          } else {
            var m = window.matchMedia('(max-width: 640px) and (pointer: coarse)').matches;
            document.documentElement.dataset.layout = m ? 'movil' : 'escritorio';
          }
        } catch (e) {
          document.documentElement.dataset.layout = 'escritorio';
        }
      })();
    </script>
    <style>
      :root {
        --header-h: 56px;
        --sidebar-w-collapsed: 52px;
        --sidebar-w-expanded: 280px;
        --imc-navy: #0b1f33;
        --imc-navy-light: #14304f;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, sans-serif;
      }

      /* El mapa empieza debajo de la cabecera (no solapado), para que el
         control de zoom nativo de MapLibre ('top-right') no quede tapado. */
      #map {
        position: absolute;
        top: var(--header-h);
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Cabecera institucional — spec 019 */
      #app-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--header-h);
        z-index: 200;
        background: var(--imc-navy);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        box-sizing: border-box;
      }

      #app-header__logo {
        height: 36px;
        width: 36px;
        object-fit: contain;
        flex-shrink: 0;
      }

      #app-header__brand {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
      }

      #app-header__name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      #app-header__tagline {
        font-size: 11px;
        color: #b9c6d6;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      #app-header__status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }

      #app-header__live {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #86efac;
        text-transform: uppercase;
      }

      #app-header__status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        animation: imc-pulse 2s infinite;
      }

      #app-header__divider {
        width: 1px;
        height: 28px;
        background: rgba(255, 255, 255, 0.15);
      }

      #app-header__datetime {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.3;
      }

      #app-header__clock {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: #fff;
      }

      #app-header__date {
        font-size: 11px;
        color: #9db3c9;
      }

      @keyframes imc-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }

      /* Sidebar plegable — spec 019 */
      #app-sidebar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        bottom: 0;
        width: var(--sidebar-w-collapsed);
        z-index: 150;
        background: var(--imc-navy-light);
        overflow: hidden;
        transition: width 0.18s ease;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 6px rgba(0, 0, 0, 0.25);
      }

      #app-sidebar.is-expanded {
        width: var(--sidebar-w-expanded);
      }

      #app-sidebar__toggle {
        height: 44px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #fff;
        border: none;
        background: transparent;
        font-size: 18px;
        flex-shrink: 0;
      }

      #app-sidebar__toggle:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      #app-sidebar__sections {
        flex: 1;
        overflow-y: auto;
      }

      .sidebar-section {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 15px;
        color: #e2e8f0;
        font-size: 13px;
        white-space: nowrap;
      }

      .sidebar-section--interactive {
        cursor: pointer;
      }

      .sidebar-section--interactive:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .sidebar-section--interactive.is-open {
        background: rgba(255, 255, 255, 0.08);
        border-left-color: #f2c744;
      }

      .sidebar-panel-content {
        padding: 4px 15px 12px 47px;
      }

      .sidebar-panel-content__title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #7d90a6;
        margin-bottom: 6px;
      }

      .proximidad-boton {
        width: 100%;
        padding: 7px 10px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }

      .proximidad-boton:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.16);
      }

      .proximidad-boton:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .proximidad-estado {
        font-size: 11px;
        color: #9db3c9;
        margin-top: 6px;
        min-height: 14px;
      }

      .proximidad-seccion {
        margin-top: 10px;
      }

      .proximidad-seccion__titulo {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #7d90a6;
        margin-bottom: 4px;
      }

      .proximidad-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: #dbe6f0;
        padding: 3px 0;
      }

      .proximidad-item__nombre {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .proximidad-item__dist {
        flex-shrink: 0;
        color: #9db3c9;
      }

      .proximidad-vacio {
        font-size: 11px;
        color: #6b7f94;
        font-style: italic;
      }

      .cordon-intro {
        font-size: 12px;
        color: #b9c6d6;
        line-height: 1.4;
        margin: 0 0 8px;
      }

      .cordon-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cordon-form label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        color: #9db3c9;
      }

      .cordon-form select,
      .cordon-form input[type='number'],
      .cordon-form textarea {
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-family: inherit;
        resize: vertical;
      }

      .cordon-checkbox-label {
        flex-direction: row !important;
        align-items: center;
        gap: 6px !important;
      }

      .cordon-pii-error {
        font-size: 11px;
        color: #fca5a5;
        background: rgba(220, 38, 38, 0.15);
        border-radius: 4px;
        padding: 4px 6px;
      }

      .cordon-badge {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        border: 1px solid;
        border-radius: 5px;
        padding: 6px 8px;
        margin-top: 8px;
      }

      .cordon-badge__punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 3px;
        flex-shrink: 0;
      }

      .cordon-badge__texto {
        font-size: 11px;
        font-weight: 700;
        color: #fff;
      }

      .cordon-badge__fuente {
        font-size: 10px;
        color: #9db3c9;
        margin-top: 2px;
      }

      .cordon-disclaimer {
        font-size: 10px;
        color: #fbbf24;
        margin-top: 4px;
        line-height: 1.4;
      }

      .cordon-resumen {
        font-size: 11px;
        color: #dbe6f0;
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .sim-corte-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #dbe6f0;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .sim-corte-sentido {
        color: #7d90a6;
        font-size: 10px;
      }

      .sim-corte-quitar {
        background: transparent;
        border: none;
        color: #f87171;
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
        flex-shrink: 0;
      }

      .sim-corte-quitar:hover {
        color: #fca5a5;
      }

      .sim-aviso-aislados {
        margin-top: 10px;
        font-size: 11px;
        color: #fca5a5;
        background: rgba(220, 38, 38, 0.15);
        border: 1px solid rgba(220, 38, 38, 0.4);
        border-radius: 5px;
        padding: 6px 8px;
      }

      .sim-aviso-aislados ul {
        margin: 4px 0 0;
        padding-left: 16px;
      }

      .sim-aviso-ok {
        margin-top: 10px;
        font-size: 11px;
        color: #86efac;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 5px;
        padding: 6px 8px;
      }

      .sidebar-panel-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #dbe6f0;
        padding: 4px 0;
        cursor: pointer;
        white-space: nowrap;
      }

      .sidebar-section--placeholder {
        color: #8fa3ba;
      }

      .sidebar-section__icon {
        font-size: 18px;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
      }

      .sidebar-section__label {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-section__tag {
        margin-left: auto;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 5px;
        border-radius: 3px;
        flex-shrink: 0;
      }

      #app-footer-attrib {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      #app-footer-attrib__text {
        font-size: 10px;
        color: #7d90a6;
        padding: 8px 15px;
        white-space: nowrap;
        overflow: hidden;
      }

      #app-sidebar__sesion {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 15px;
        font-size: 11px;
        color: #c7d4e1;
        white-space: nowrap;
        overflow: hidden;
      }

      #app-sidebar__sesion-usuario {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #app-sidebar__logout {
        flex-shrink: 0;
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        background: transparent;
        color: #eef3f8;
        cursor: pointer;
      }

      #app-sidebar__logout:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      #app-sidebar__logout:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Aviso de nueva versión (PWA) — spec 028 */
      #pwa-toast {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px 10px 16px;
        border-radius: 10px;
        background: var(--imc-navy, #0b1f33);
        color: #eef3f8;
        font-size: 13px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      #pwa-toast button {
        font-size: 13px;
        font-weight: 600;
        padding: 6px 12px;
        border: 0;
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        min-height: 32px;
      }

      #pwa-toast .pwa-toast__cerrar {
        background: transparent;
        color: #9fb3c8;
        font-weight: 400;
        padding: 6px 8px;
      }

      #controls {
        position: absolute;
        top: calc(var(--header-h) + 12px);
        left: calc(var(--sidebar-w-collapsed) + 12px);
        z-index: 1;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 6px;
        padding: 10px 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
      }

      .controls__row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .controls__row--hora,
      .controls__row--trafico {
        margin-top: 8px;
      }

      .controls__row[hidden] {
        display: none;
      }

      .mock-badge {
        background: #d64545;
        color: #fff;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 4px;
      }

      #mock-banner {
        position: absolute;
        top: calc(var(--header-h) + 12px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        background: #d64545;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }

      #info-panels {
        position: absolute;
        bottom: 30px;
        left: calc(var(--sidebar-w-collapsed) + 12px);
        right: 12px;
        z-index: 1;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-start;
        max-height: calc(100vh - var(--header-h) - 260px);
        overflow-y: auto;
      }

      .info-panel {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 6px;
        padding: 10px 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        min-width: 140px;
      }

      .info-panel__main {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .info-panel__icon {
        font-size: 28px;
        line-height: 1;
      }

      .info-panel__value {
        font-size: 22px;
        font-weight: 700;
      }

      .info-panel__value--small {
        font-size: 15px;
      }

      .info-panel__badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 0 4px;
      }

      .info-panel__desc {
        font-size: 13px;
        color: #333;
        margin-top: 2px;
      }

      .info-panel__viento {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #444;
        margin-top: 4px;
      }

      .info-panel__viento-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .info-panel__meta {
        font-size: 11px;
        color: #777;
        margin-top: 6px;
      }

      .info-panel__stale {
        color: #b45309;
        font-weight: 600;
        margin-left: 4px;
      }

      /* Spec 026 §6 — aviso de que las fechas son la vigencia del permiso,
         no la duración real del corte; debe verse, no ir en letra pequeña
         (CLAUDE.md §4), de ahí el color y el peso frente a .info-panel__meta normal. */
      .info-panel__meta--aviso {
        color: #92400e;
        font-weight: 600;
      }

      .prediccion-panel__tramos {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin-top: 6px;
      }

      .prediccion-panel__tramo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 40px;
      }

      .prediccion-panel__hora {
        font-size: 11px;
        color: #666;
      }

      .prediccion-panel__icon {
        font-size: 20px;
        line-height: 1;
      }

      .prediccion-panel__temp {
        font-size: 14px;
        font-weight: 700;
      }

      .prediccion-panel__lluvia {
        font-size: 11px;
        color: #0369a1;
      }

      #insights-panel {
        max-width: 260px;
      }

      .insight-panel__tarjetas {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }

      .insight-card {
        border-radius: 4px;
        padding: 6px 8px;
        border-left: 4px solid #b45309;
        background: #fffbeb;
      }

      .insight-card--urgente {
        border-left-color: #dc2626;
        background: #fef2f2;
      }

      .insight-card__titulo {
        font-size: 12px;
        font-weight: 700;
        color: #333;
      }

      .insight-card__desc {
        font-size: 11px;
        color: #555;
        margin-top: 2px;
      }

      .insight-card__copiar {
        margin-top: 6px;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid #999;
        background: #fff;
        cursor: pointer;
      }

      .insight-card__copiar:hover {
        background: #f0f0f0;
      }

      /* spec 024 §5 — un chip por fuenteSpec, para ver de un vistazo qué señales se cruzaron sin leer la descripción completa. */
      .insight-card__fuentes {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }

      .insight-card__fuente-chip {
        font-size: 10px;
        font-weight: 600;
        color: #666;
        background: rgba(0, 0, 0, 0.06);
        border-radius: 3px;
        padding: 1px 5px;
      }

      .trafico-historico__spark {
        width: 140px;
        height: 28px;
        margin-top: 6px;
        display: block;
      }

      .trafico-leyenda__row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #333;
        margin-top: 3px;
      }

      .trafico-leyenda__dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      #media-panel {
        position: absolute;
        top: calc(var(--header-h) + 12px);
        right: 60px;
        z-index: 1;
        width: 300px;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        overflow: hidden;
      }

      #media-panel[hidden] {
        display: none;
      }

      /* Spec 025 — panel "pequeño junto al de contexto mediático" (§5), a su
         izquierda, mismo estilo visual que #media-panel. */
      #tendencia-panel {
        position: absolute;
        top: calc(var(--header-h) + 12px);
        right: 372px;
        z-index: 1;
        width: 240px;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        overflow: hidden;
      }

      #tendencia-panel[hidden] {
        display: none;
      }

      .tendencia-panel__select {
        float: right;
        font-size: 11px;
      }

      .tendencia-panel__termino {
        padding: 7px 12px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .tendencia-panel__palabra {
        font-size: 13px;
        font-weight: 600;
        color: #222;
      }

      .tendencia-panel__frecuencia {
        font-size: 11px;
        color: #888;
      }

      .tendencia-panel__insuficiente {
        padding: 12px;
        font-size: 12px;
        color: #666;
        line-height: 1.4;
      }

      .media-panel__header {
        padding: 10px 12px;
        font-weight: 700;
        border-bottom: 1px solid #eee;
      }

      .media-panel__list {
        overflow-y: auto;
        flex: 1;
      }

      .media-panel__item {
        display: block;
        padding: 8px 12px;
        border-bottom: 1px solid #f0f0f0;
        text-decoration: none;
        color: inherit;
      }

      .media-panel__item:hover {
        background: #f7f7f7;
      }

      .media-panel__item-titulo {
        font-size: 13px;
        color: #222;
        line-height: 1.35;
      }

      .media-panel__item-meta {
        font-size: 11px;
        color: #888;
        margin-top: 3px;
      }

      .media-panel__grupo-titulo {
        position: sticky;
        top: 0;
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: #555;
        background: #f0f0f0;
        border-bottom: 1px solid #e0e0e0;
      }

      .media-panel__chips {
        margin-top: 5px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .media-panel__chip {
        display: inline-block;
        padding: 2px 7px;
        font-size: 10px;
        font-weight: 600;
        color: #1a5276;
        background: #eaf2f8;
        border-radius: 10px;
        line-height: 1.4;
      }

      .media-panel__chip--baja-confianza {
        color: #7d6608;
        background: #fef9e7;
      }

      /* Spec 026 — tooltip mínimo específico de esta capa (ver comentario en
         buildViaPublicaTooltip, src/main.ts). Posicionado en coordenadas de
         pantalla junto al cursor, nunca intercepta clics (pointer-events: none). */
      #via-publica-tooltip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        background: rgba(20, 20, 20, 0.92);
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.4;
        max-width: 220px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .via-publica-tooltip__tipo {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.02em;
        opacity: 0.85;
      }

      .via-publica-tooltip__calle {
        font-weight: 600;
        margin-top: 2px;
      }

      .via-publica-tooltip__vigencia {
        margin-top: 3px;
        opacity: 0.75;
      }

      #media-panel .info-panel__meta {
        padding: 8px 12px;
        margin-top: 0;
        border-top: 1px solid #eee;
      }

      /* ================================================================
         Layout MÓVIL — spec 029. Activo cuando <html data-layout="movil">
         (deteccion-dispositivo.ts / script inline). Escritorio: sin cambios.
         ================================================================ */

      :root[data-layout='movil'] {
        --header-h: 52px;
      }

      /* Cabecera: safe-area arriba, reloj compacto, sin fecha. */
      :root[data-layout='movil'] #app-header {
        height: calc(var(--header-h) + env(safe-area-inset-top));
        padding-top: env(safe-area-inset-top);
        padding-left: max(12px, env(safe-area-inset-left));
        gap: 8px;
      }
      :root[data-layout='movil'] #app-header__tagline,
      :root[data-layout='movil'] #app-header__date,
      :root[data-layout='movil'] #app-header__divider {
        display: none;
      }
      :root[data-layout='movil'] #app-header__name {
        font-size: 14px;
      }
      :root[data-layout='movil'] #app-header__status {
        gap: 8px;
      }
      :root[data-layout='movil'] #app-header__clock {
        font-size: 14px;
      }

      /* El mapa arranca bajo la cabecera (con safe-area). */
      :root[data-layout='movil'] #map {
        top: calc(var(--header-h) + env(safe-area-inset-top));
      }

      /* Sidebar: hoja a pantalla completa que entra deslizando desde la
         izquierda (transform — el botón flotante de abrir vive fuera de este
         subárbol, así que el bloque contenedor que crea el transform no le
         afecta). */
      :root[data-layout='movil'] #app-sidebar {
        top: calc(var(--header-h) + env(safe-area-inset-top));
        width: 100%;
        max-width: 30rem;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        z-index: 150;
        padding-left: env(safe-area-inset-left);
        padding-bottom: env(safe-area-inset-bottom);
      }
      :root[data-layout='movil'] #app-sidebar.is-expanded {
        transform: translateX(0);
      }
      /* El toggle del raíl (⟨/☰) no se usa en móvil; abre el FAB de abajo. */
      :root[data-layout='movil'] #app-sidebar__toggle {
        display: none;
      }
      /* Botón flotante para abrir la hoja. */
      #app-sidebar__fab {
        display: none;
      }
      :root[data-layout='movil'] #app-sidebar__fab {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: calc(var(--header-h) + env(safe-area-inset-top) + 10px);
        left: 10px;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: var(--imc-navy);
        color: #fff;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        z-index: 151;
        cursor: pointer;
      }
      :root[data-layout='movil'] #app-sidebar.is-expanded ~ #app-sidebar__fab {
        display: none;
      }
      :root[data-layout='movil'] #app-sidebar__cerrar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin: 4px 4px 0 auto;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        flex-shrink: 0;
      }
      :root[data-layout='movil'] #app-sidebar:not(.is-expanded) #app-sidebar__cerrar {
        display: none;
      }
      :root[data-layout='movil'] #app-sidebar__backdrop {
        position: fixed;
        inset: 0;
        z-index: 149;
        background: rgba(0, 0, 0, 0.4);
      }
      :root[data-layout='movil'] #app-sidebar__backdrop[hidden] {
        display: none;
      }
      /* Objetivos táctiles ≥ 44 px dentro de la hoja. */
      :root[data-layout='movil'] .sidebar-section {
        min-height: 44px;
        font-size: 14px;
      }
      :root[data-layout='movil'] .sidebar-panel-checkbox {
        min-height: 40px;
        font-size: 13px;
      }
      :root[data-layout='movil'] .sidebar-panel-checkbox input {
        width: 20px;
        height: 20px;
      }
      :root[data-layout='movil'] .proximidad-boton {
        min-height: 40px;
        font-size: 13px;
      }

      /* Escritorio: ocultar los controles solo-móvil. */
      :root:not([data-layout='movil']) #app-sidebar__cerrar,
      :root:not([data-layout='movil']) #app-sidebar__backdrop,
      :root:not([data-layout='movil']) #sheet-tirador {
        display: none;
      }

      /* --- Bottom sheet de paneles --- */
      :root[data-layout='movil'] #info-panels {
        position: fixed;
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
        height: 42vh;
        height: 42svh;
        max-height: 95vh;
        max-height: 95svh;
        margin: 0;
        padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        z-index: 140;
        display: block;
        background: #f1f4f8;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.28);
        overflow-y: auto;
        overscroll-behavior: contain;
        transition: height 0.16s ease;
      }
      :root[data-layout='movil'] #info-panels[data-sheet='oculto'] {
        overflow: hidden;
      }
      :root[data-layout='movil'] #sheet-tirador {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 44px;
        border: none;
        background: #f1f4f8;
        border-radius: 14px 14px 0 0;
        cursor: grab;
        touch-action: none;
        z-index: 2;
      }
      :root[data-layout='movil'] #sheet-tirador__barra {
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: #b3bfce;
      }
      /* Los paneles reparentados y las tarjetas fijas: en columna, ancho completo. */
      :root[data-layout='movil'] #info-panels > #controls,
      :root[data-layout='movil'] #info-panels > #media-panel,
      :root[data-layout='movil'] #info-panels > #tendencia-panel,
      :root[data-layout='movil'] #info-panels > .info-panel {
        position: static !important;
        inset: auto !important;
        width: auto !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 10px 10px !important;
        box-sizing: border-box;
      }
      :root[data-layout='movil'] #info-panels > #media-panel,
      :root[data-layout='movil'] #info-panels > #tendencia-panel {
        display: flex !important;
      }
      :root[data-layout='movil'] #info-panels > #media-panel[hidden],
      :root[data-layout='movil'] #info-panels > #tendencia-panel[hidden] {
        display: none !important;
      }

      /* mock-banner no debe tapar el raíl del sidebar en móvil. */
      :root[data-layout='movil'] #mock-banner {
        left: 50%;
        font-size: 12px;
        padding: 5px 12px;
      }

      /* Controles nativos de MapLibre por encima del sheet colapsado. */
      :root[data-layout='movil'] .maplibregl-ctrl-bottom-left,
      :root[data-layout='movil'] .maplibregl-ctrl-bottom-right {
        margin-bottom: calc(46px + env(safe-area-inset-bottom));
      }

      /* Enlace "Ver versión de escritorio/móvil". */
      #app-sidebar__layout {
        padding: 8px 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #app-sidebar__layout-link {
        background: none;
        border: none;
        color: #9db3c9;
        font-size: 11px;
        text-decoration: underline;
        cursor: pointer;
        padding: 4px 0;
        white-space: nowrap;
      }
      #app-sidebar__layout-link:hover {
        color: #dbe6f0;
      }
      :root[data-layout='movil'] #app-sidebar__layout-link {
        font-size: 13px;
        min-height: 40px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
